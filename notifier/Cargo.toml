[package]
name = "oxidepm-adapter-notifier"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "OxidePM adapter: Telegram, Discord, Slack and webhook notifications"

[[bin]]
name = "oxidepm-notifier"
path = "src/main.rs"

[dependencies]
oxidepm-adapter-sdk = { path = "../sdk" }
oxidepm-adapter-proto = { workspace = true }
oxidepm-core = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
url = { workspace = true }

[dev-dependencies]
oxidepm-runtime-testkit = { path = "../runtime-testkit" }
tempfile = "3.10"
tar = { version = "0.4", default-features = false }
flate2 = "1.0"
nix = { version = "0.28", features = ["signal", "process"] }
sha2 = { workspace = true }
hmac = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }
oxidepm-core = { workspace = true }
oxidepm-adapter-proto = { workspace = true }
