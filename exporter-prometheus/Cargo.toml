[package]
name = "oxidepm-adapter-exporter-prometheus"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "OxidePM adapter: Prometheus /metrics for the managed apps"

[[bin]]
name = "oxidepm-exporter-prometheus"
path = "src/main.rs"

[dependencies]
oxidepm-adapter-sdk = { path = "../sdk" }
oxidepm-adapter-proto = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
hyper = { workspace = true }

[dev-dependencies]
tempfile = "3.10"
tar = { version = "0.4", default-features = false }
flate2 = "1.0"
nix = { version = "0.28", features = ["signal", "process"] }
sha2 = { workspace = true }
oxidepm-core = { workspace = true }
