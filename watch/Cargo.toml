[package]
name = "oxidepm-adapter-watch"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "oxidepm-watch"
path = "src/main.rs"

[dependencies]
oxidepm-adapter-sdk = { path = "../sdk" }
oxidepm-adapter-proto.workspace = true
tokio.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
notify = { version = "7.0", default-features = false }
glob = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
notify = { version = "7.0", default-features = false, features = ["macos_fsevent"] }

[dev-dependencies]
oxidepm-runtime-testkit = { path = "../runtime-testkit" }
oxidepm-core.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
