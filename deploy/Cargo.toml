[package]
name = "oxidepm-adapter-deploy"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Deploy and inspect remote hosts over SSH"

[[bin]]
name = "oxidepm-deploy"
path = "src/main.rs"

[dependencies]
oxidepm-adapter-sdk = { path = "../sdk" }
oxidepm-adapter-proto.workspace = true
tokio = { workspace = true, features = ["process"] }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
oxidepm-runtime-testkit = { path = "../runtime-testkit" }
tempfile = "3"
